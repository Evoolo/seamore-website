<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sea More · Content Editor</title>
    <style>
      body { margin: 0; background: #f7f9f8; color: #071d34; font: 16px/1.6 system-ui, sans-serif; }
      #setup { box-sizing: border-box; max-width: 620px; margin: 15vh auto; padding: 48px; background: #d9eef4; }
      #setup h1 { margin: 0 0 16px; font-size: clamp(2.5rem, 6vw, 4rem); line-height: 1; letter-spacing: -.04em; }
      #setup p { margin: 0; }
    </style>
  </head>
  <body>
    <main id="setup"><h1>Content editor setup in progress.</h1><p>The Sea More editor will be available here after the GitHub App connection is complete.</p></main>
    <script>
      fetch("https://seamore-decap-auth.fux-media.workers.dev/health", { cache: "no-store" })
        .then((response) => response.json())
        .then((health) => {
          if (!health.configured) return;
          document.getElementById("setup").remove();
          const script = document.createElement("script");
          script.src = "https://cdn.jsdelivr.net/npm/decap-cms@^3.17.0/dist/decap-cms.js";
          document.body.appendChild(script);
        }).catch(() => {});
    </script>
  </body>
</html>
